name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: echo "Go lint + tests go here"

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: hashFiles('AI_Assessment/pyproject.toml') != ''
        run: pip install -r AI_Assessment/service/requirements-dev.txt
      - name: Lint
        if: hashFiles('AI_Assessment/pyproject.toml') != ''
        working-directory: AI_Assessment
        run: ruff check .
      - name: Test
        if: hashFiles('AI_Assessment/pyproject.toml') != ''
        working-directory: AI_Assessment
        run: pytest

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: echo "Next.js lint + build go here"
