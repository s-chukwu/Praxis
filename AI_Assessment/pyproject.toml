[tool.ruff]
line-length = 120
target-version = "py312"
src = ["service", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["praxis_assessment", "support"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603"]

[tool.pytest.ini_options]
pythonpath = ["service", "tests"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
